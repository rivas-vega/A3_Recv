name: S0 domain generalization checks
on:
  push:
    paths:
      - 's0_domain_generalization.py'
      - 's0_domain_generalization.ipynb'
      - 'test_s0_domain_generalization.py'
      - 'adain_networks.py'
      - '.github/workflows/s0_domain_generalization.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-and-public-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow requests tqdm pyarrow==21.0.0 open_clip_torch==3.2.0 timm==1.0.22 huggingface_hub==0.36.0
      - name: Compile engine and notebook cells
        run: |
          python -m py_compile s0_domain_generalization.py adain_networks.py
          python - <<'PY'
          import ast,json,pathlib
          p=pathlib.Path('s0_domain_generalization.ipynb')
          if p.exists():
              for c in json.loads(p.read_text())['cells']:
                  if c['cell_type']=='code':
                      text=''.join(c['source'])
                      text='\n'.join(line for line in text.splitlines() if not line.startswith(('%','!')))
                      ast.parse(text)
          PY
      - name: Data isolation, schedule and public checkpoint smoke tests
        env:
          RUN_NETWORK_TESTS: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python -m unittest -v test_s0_domain_generalization
